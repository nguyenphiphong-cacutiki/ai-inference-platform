# Build the OCR + Search images, push them to GHCR, then deploy over SSH.
# This is the "optional Phase 6" pipeline — see docs/06-cicd.md for setup.
#
# Required repository secrets:
#   SSH_HOST, SSH_USER, SSH_KEY (private key)   -> how to reach the VPS
# GITHUB_TOKEN is provided automatically and is used to push to GHCR.

name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}   # e.g. ghcr.io/you/ai-deployment-hub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed to push to GHCR
    strategy:
      matrix:
        service: [ocr-service, search-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/ai-deployment-hub
            git pull --ff-only
            # Pull the freshly built images and recreate only what changed.
            docker compose pull ocr-service search-service
            docker compose up -d ocr-service search-service
            # Post-deploy healthcheck: fail the job if a service isn't healthy.
            for svc in ocr-service search-service; do
              for i in $(seq 1 20); do
                status=$(docker inspect --format '{{.State.Health.Status}}' "$svc" 2>/dev/null || echo missing)
                [ "$status" = "healthy" ] && break
                sleep 5
              done
              [ "$status" = "healthy" ] || { echo "$svc not healthy ($status)"; docker compose logs --tail=50 "$svc"; exit 1; }
            done
            echo "Deploy OK"
