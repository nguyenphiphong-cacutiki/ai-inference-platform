# Minimal single-binary Loki config (filesystem storage). Good enough for a
# single VPS; for production you'd point object_store at S3/MinIO.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# TSDB schema v13 is the current recommended format for Loki 3.x.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h           # keep logs ~7 days
  allow_structured_metadata: true
  volume_enabled: true

query_range:
  align_queries_with_step: true
