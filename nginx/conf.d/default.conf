# =============================================================================
# Gateway server blocks
# =============================================================================

# Reusable proxy headers so backends see the real client + scheme.
# (Defined as a map-free include via a snippet would be cleaner, but inlining
#  keeps this readable for learning.)

# --- Internal status page for nginx-prometheus-exporter --------------------
# Listens on 8080, which is NOT published to the host, so only containers on the
# aihub network (the exporter) can reach it.
server {
    listen 8080;
    server_name _;
    location /stub_status {
        stub_status;
    }
}

# --- Port 80: health + redirect everything to HTTPS ------------------------
server {
    listen 80;
    server_name _;

    # Plain-HTTP health endpoint used by the container HEALTHCHECK.
    location /healthz {
        return 200 "ok\n";
        default_type text/plain;
    }

    # Everything else is permanently redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443: the actual API gateway --------------------------------------
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Docker's embedded DNS server. Resolving upstream names at REQUEST time
    # (instead of at startup) means Nginx boots even if a backend container is
    # down — you then get a 502 only when that route is hit, which is exactly
    # the behaviour we want to observe in the troubleshooting drills.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Common proxy headers (forward real client IP + that we terminated TLS).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    location = / {
        return 200 "AI Hub gateway up\n";
        default_type text/plain;
    }
    location /healthz {
        return 200 "ok\n";
        default_type text/plain;
    }

    # ---- LLM (Ollama) -------------------------------------------------------
    # Strip the /llm prefix so /llm/api/generate -> Ollama's /api/generate.
    location /llm/ {
        auth_basic           "AI Hub";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req            zone=api_limit burst=20 nodelay;

        set $upstream_llm http://ollama:11434;
        rewrite ^/llm/(.*)$ /$1 break;
        proxy_pass $upstream_llm;

        proxy_buffering off;            # stream tokens back as they arrive
        proxy_read_timeout 300s;        # generation can be slow on CPU
    }

    # ---- OCR ----------------------------------------------------------------
    # Pass-through: paths are already namespaced (/ocr/run, /ocr/health).
    location /ocr/ {
        auth_basic           "AI Hub";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req            zone=api_limit burst=20 nodelay;

        set $upstream_ocr http://ocr-service:8000;
        proxy_pass $upstream_ocr$request_uri;
        proxy_read_timeout 120s;
    }

    # ---- Search / RAG -------------------------------------------------------
    location /search/ {
        auth_basic           "AI Hub";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req            zone=api_limit burst=20 nodelay;

        set $upstream_search http://search-service:8000;
        proxy_pass $upstream_search$request_uri;
        proxy_read_timeout 60s;
    }
}
