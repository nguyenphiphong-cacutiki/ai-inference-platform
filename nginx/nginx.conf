# Main Nginx configuration. Server blocks live in conf.d/default.conf.
user  nginx;
worker_processes  auto;                 # one worker per CPU core

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log with timing fields that make troubleshooting far easier:
    #   rt  = total request time
    #   uct = upstream connect time
    #   urt = upstream response time
    #   upstream = which backend actually served the request (502 debugging)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent rt=$request_time '
                      'uct=$upstream_connect_time urt=$upstream_response_time '
                      'upstream=$upstream_addr';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # OCR accepts image uploads — allow a reasonably large body.
    client_max_body_size 20m;

    # ---- Rate limiting ----
    # Track each client IP in a 10MB shared memory zone, capped at 10 req/sec.
    # Bursts are configured per-location below. Over-limit requests get HTTP 429.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
