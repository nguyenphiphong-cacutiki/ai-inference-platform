# Prometheus scrape configuration.
# Each `job` below is a target Prometheus pulls /metrics from every 15s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s          # how often alert rules are evaluated

# Alert rules live in a separate file for clarity.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus scraping itself — handy sanity check.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics: CPU, RAM, disk, network of the VPS itself.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container metrics: CPU/mem/network of every Docker container.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Nginx request/connection stats (via the stub_status exporter).
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Our own FastAPI services expose custom app metrics at /metrics.
  - job_name: ocr-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ocr-service:8000"]

  - job_name: search-service
    metrics_path: /metrics
    static_configs:
      - targets: ["search-service:8000"]

  # Milvus exposes Prometheus metrics on its health port.
  - job_name: milvus
    metrics_path: /metrics
    static_configs:
      - targets: ["milvus:9091"]
