# Tells Grafana to load any dashboard JSON files it finds in the mounted folder.
apiVersion: 1

providers:
  - name: aihub-dashboards
    orgId: 1
    folder: "AI Hub"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
